<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>광고 효율 대시보드 | 오아주식회사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#fff;--bg2:#f5f5f4;--bg3:#f1efe8;
  --text:#1a1a18;--text2:#5f5e5a;--text3:#888780;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --green:#1D9E75;--green-bg:#EAF3DE;--green-t:#3B6D11;--green-b:#97C459;
  --blue:#378ADD;--blue-bg:#E6F1FB;--blue-t:#0C447C;--blue-b:#85B7EB;
  --purple-bg:#EEEDFE;--purple-t:#3C3489;--purple-b:#AFA9EC;
  --amber-bg:#FAEEDA;--amber-t:#854F0B;--amber-b:#EF9F27;
  --red-bg:#FCEBEB;--red-t:#A32D2D;--red-b:#D85A30;
  --r:8px;--rl:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--text);font-size:13px}
.page{max-width:1320px;margin:0 auto;padding:20px 16px}

/* 헤더 */
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:8px;flex-wrap:wrap}
.htitle{font-size:20px;font-weight:500;display:flex;align-items:center;gap:7px;color:var(--text)}
.hright{display:flex;gap:5px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:0 10px;height:26px;border-radius:var(--r);cursor:pointer;border:.5px solid;transition:opacity .15s;white-space:nowrap}
.btn:hover{opacity:.78} .btn i{font-size:11px}
.btn-up{background:var(--blue-bg);color:var(--blue-t);border-color:var(--blue-b)}
.btn-in{background:var(--green-bg);color:var(--green-t);border-color:var(--green-b)}
.btn-co{background:var(--purple-bg);color:var(--purple-t);border-color:var(--purple-b)}
.btn-co.run{background:var(--amber-bg);color:var(--amber-t);border-color:var(--amber-b);cursor:wait}

/* 날짜피커 */
.dp-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dp-wrap{position:relative}
.dp-input{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:0 12px;height:32px;border:.5px solid var(--border2);border-radius:var(--r);cursor:pointer;background:var(--bg);min-width:230px;user-select:none}
.dp-input:hover{border-color:var(--green)}
.dp-input i{font-size:14px;color:var(--text2)}
.dp-val{flex:1;color:var(--text)}
.dp-x{color:var(--text3);font-size:16px;line-height:1} .dp-x:hover{color:var(--text)}
.dp-drop{display:none;position:absolute;top:36px;left:0;z-index:300;background:var(--bg);border:.5px solid var(--border2);border-radius:var(--rl);box-shadow:0 8px 28px rgba(0,0,0,.14);padding:12px;min-width:470px}
.dp-drop.open{display:block}
.dp-dtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dp-dtitle{font-size:11px;font-weight:500;color:var(--text2)}
.dp-navb{width:24px;height:24px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:.5px solid var(--border);background:transparent;cursor:pointer;border-radius:5px;font-size:13px;color:var(--text)}
.dp-navb:hover{background:var(--bg2)}
.dp-months{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dp-mt{font-size:11px;font-weight:500;text-align:center;margin-bottom:5px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.dow{font-size:9px;color:var(--text3);text-align:center;padding:3px 0}
.dow:first-child{color:#A32D2D} .dow:last-child{color:#185FA5}
.dc{height:26px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;user-select:none;color:var(--text)}
.dc:hover:not(.other){background:var(--bg2)}
.dc.other{opacity:.27;pointer-events:none}
.dc.sun{color:#A32D2D} .dc.sat{color:#185FA5}
.dc.today{font-weight:600;text-decoration:underline}
.dc.ir{background:#E6F1FB;border-radius:0}
.dc.rs{background:var(--green);color:#fff;font-weight:600;border-radius:3px 0 0 3px}
.dc.re{background:var(--green);color:#fff;font-weight:600;border-radius:0 3px 3px 0}
.dc.rs.re{border-radius:3px}
.dp-foot{margin-top:10px;display:flex;justify-content:space-between;align-items:center;border-top:.5px solid var(--border);padding-top:8px;gap:6px}
.dp-sel{font-size:11px;color:var(--text2)} .dp-sel strong{color:var(--text)}
.dp-btns{display:flex;gap:5px}
.dp-clr{font-size:10px;padding:0 9px;height:24px;cursor:pointer;border:.5px solid var(--border2);background:transparent;color:var(--text2);border-radius:5px}
.dp-apl{font-size:10px;padding:0 13px;height:24px;cursor:pointer;border:.5px solid var(--green);background:var(--green);color:#fff;border-radius:5px;font-weight:500}

/* 수집로그 */
.clog{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:11px;display:none}
.clog.show{display:block}
.cl{display:flex;align-items:center;gap:6px;padding:2px 0}
.cdone{color:var(--green-t)} .cerr{color:var(--red-t)} .crun{color:var(--amber-t)}

/* 요약카드 */
.sg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media(max-width:680px){.sg{grid-template-columns:repeat(2,1fr)}}
.mc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--r);padding:10px 12px}
.ml{font-size:10px;color:var(--text2);margin-bottom:3px}
.mv{font-size:17px;font-weight:500;color:var(--text)}
.md{font-size:10px;color:var(--text3);margin-top:2px}
.up{color:var(--green)} .dn{color:var(--red-b)}

/* 테이블카드 */
.tc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden;margin-bottom:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:var(--bg2);color:var(--text2);font-weight:500;padding:6px 8px;border-bottom:.5px solid var(--border);text-align:right;white-space:nowrap}
thead th:first-child{text-align:left;min-width:100px}
th.pv,td.pv{color:var(--text3);font-size:10px}
tbody td{padding:5px 8px;border-bottom:.5px solid var(--border);text-align:right;white-space:nowrap;color:var(--text)}
tbody td:first-child{text-align:left;font-weight:500}
tbody tr:hover{background:var(--bg2)}
tfoot td{padding:5px 8px;font-weight:600;border-top:1.5px solid var(--border2);text-align:right;background:var(--bg2)}
tfoot td:first-child{text-align:left}
.badge{display:inline-block;padding:1px 5px;border-radius:4px;font-size:10px;font-weight:500}
.bhi{background:var(--green-bg);color:var(--green-t)}
.bmd{background:var(--amber-bg);color:var(--amber-t)}
.blo{background:var(--red-bg);color:var(--red-t)}
.bna{background:var(--bg2);color:var(--text3)}
.bau{background:var(--blue-bg);color:var(--blue-t)}
.blo2{background:var(--amber-bg);color:var(--amber-t)}

/* 차트 */
.cr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:580px){.cr{grid-template-columns:1fr}}
.cc{background:var(--bg);border:.5px solid var(--border);border-radius:var(--rl);padding:10px 12px}
.cl2{font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500}

/* 모달 */
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.48);z-index:500;align-items:flex-start;justify-content:center;padding:36px 14px;overflow-y:auto}
.mo.open{display:flex}
.mb{background:var(--bg);border:.5px solid var(--border2);border-radius:var(--rl);padding:20px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto}
.mt2{font-size:15px;font-weight:500;margin-bottom:4px}
.ms{font-size:11px;color:var(--text2);margin-bottom:14px}
.msec{font-size:10px;font-weight:600;color:var(--text2);border-top:.5px solid var(--border);padding-top:7px;margin:7px 0 5px}
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fr{display:flex;flex-direction:column;gap:3px}
.fr label{font-size:10px;color:var(--text2)}
.fr input{font-size:12px;padding:5px 8px;height:30px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--bg);color:var(--text);outline:none}
.fr input:focus{border-color:var(--green)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.mcl{font-size:12px;padding:0 14px;height:32px;border-radius:var(--r);cursor:pointer;border:.5px solid var(--border2);background:transparent;color:var(--text2)}
.msv{font-size:12px;padding:0 16px;height:32px;border-radius:var(--r);cursor:pointer;border:.5px solid var(--green);background:var(--green);color:#fff;font-weight:500}

/* 토스트 */
.toast{position:fixed;bottom:20px;right:20px;z-index:999;font-size:12px;padding:10px 14px;border-radius:var(--r);border:.5px solid;display:none;align-items:center;gap:7px;box-shadow:0 4px 18px rgba(0,0,0,.13)}
.toast.show{display:flex}
.tok{background:var(--green-bg);color:var(--green-t);border-color:var(--green)}
.terr{background:var(--red-bg);color:var(--red-t);border-color:var(--red-b)}

.bto{background:#FEF3E2;color:#7C3D12;border:.5px solid #F59E0B}
.boh{background:#FFF0E6;color:#7C3D12;border:.5px solid #F97316}
</style>
</head>

const PLATFORMS=[

  {key:'gs',        name:'GS홈쇼핑 AI',   type:'auto'},

  {key:'ali',       name:'알리 CPC',      type:'excel'},
];

const SK='oa_ad_weekly_data_v2';
let D={}, curWk='';
let CL={y:2026,m:3};
let rS=null,rE=null,hov=null,sel=false,dpOpen=false;
let c1=null,c2=null,collecting=false,logs=[];

/* ── 날짜 유틸 ── */
function isoWk(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return`${d.getUTCFullYear()}-W${String(Math.ceil((((d-ys)/86400000)+1)/7)).padStart(2,'0')}`;
}
function wkDates(wk){
  const[yr,wn]=wk.split('-W').map(Number);
  const j=new Date(Date.UTC(yr,0,4));const s=new Date(j);
  s.setUTCDate(j.getUTCDate()-(j.getUTCDay()||7)+1);
  const st=new Date(s);st.setUTCDate(s.getUTCDate()+(wn-1)*7);
  const en=new Date(st);en.setUTCDate(st.getUTCDate()+6);
  return{start:st,end:en};
}
function wkLbl(wk){
  const{start:s,end:e}=wkDates(wk);
  const f=d=>`${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')}`;
  return`${f(s)}~${f(e)}`;
}
function prevWk(wk){
  const[yr,wn]=wk.split('-W').map(Number);
  if(wn===1)return isoWk(new Date(Date.UTC(yr-1,11,28)));
  return`${yr}-W${String(wn-1).padStart(2,'0')}`;
}
function d2s(d){return`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;}
function s2d(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d));}
function fmtD(s,e){
  const f=d=>`${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
  return`${f(s2d(s))} ~ ${f(s2d(e))}`;
}
function rngWks(s,e){
  const ws=new Set();const c=new Date(s2d(s));const end=s2d(e);
  while(c<=end){ws.add(isoWk(c));c.setUTCDate(c.getUTCDate()+1);}
  return[...ws].sort();
}
const lo=()=>rS&&rE?(rS<=rE?rS:rE):rS;
const hi=()=>rS&&rE?(rS<=rE?rE:rS):null;

/* ── 스토리지 ── */
function load(){
  try{const el=document.getElementById('__DATA__');D=el&&el.textContent.trim()?JSON.parse(el.textContent):{};}catch(e){D={};}
  if(!D['2026-W19']){
    D['2026-W19']={label:wkLbl('2026-W19'),platforms:{
      alwayz:   {adCost:45882,  sales:523910,  roas:1142,clicks:11701,cpc:null,impressions:null,  ctr:null},
      ssg:      {adCost:350730, sales:3632790, roas:1036,clicks:2081, cpc:169, impressions:231579,ctr:1.13},
      gs:       {adCost:139760, sales:1378999, roas:987, clicks:null, cpc:null,impressions:null,  ctr:null},
      kurly:    {adCost:394380, sales:3330400, roas:844, clicks:null, cpc:104, impressions:177749,ctr:2.14},
      lotte_ai: {adCost:199320, sales:1399000, roas:702, clicks:1507, cpc:132, impressions:136839,ctr:1.10},
      lotte_cpc:{adCost:10725,  sales:39900,   roas:372, clicks:95,   cpc:113, impressions:3095,  ctr:3.07},
      toss_ai:null,toss_cpc:null,ohouse:null,ali:null,
    }};
  }
  const wks=Object.keys(D).filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort();
  if(!curWk||!D[curWk])curWk=wks[wks.length-1];
  if(!rS){
    const{start,end}=wkDates(curWk);
    rS=d2s(start);rE=d2s(end);
    CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};
  }
}
function save(){
  const body={};
  Object.entries(D).filter(([k])=>/^\d{4}-W\d{2}$/.test(k)).forEach(([k,v])=>{
    body[k]={label:v.label||'',platforms:v.platforms||{}};
  });
  fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json())
    .then(d=>{if(d.ok)toast('저장 완료','ok');else toast('저장 오류: '+(d.error||'unknown'),'err');})
    .catch(e=>toast('저장 오류: '+e.message,'err'));
}
function importData(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const imported=JSON.parse(e.target.result);let cnt=0;
      Object.entries(imported).forEach(([wk,val])=>{if(/^\d{4}-W\d{2}$/.test(wk)){D[wk]=val;cnt++;}});
      toast(cnt+'개 주차 불러오기 완료','ok');renderDP();renderAll();
    }catch(err){toast('JSON 오류: '+err.message,'err');}
    input.value='';
  };
  reader.readAsText(file,'UTF-8');
}

/* ── 집계 ── */
function totWk(wk){
  const d=D[wk];if(!d)return null;
  let ac=0,sa=0,cl=0,im=0,cnt=0;
  PLATFORMS.forEach(p=>{const pd=d.platforms[p.key];if(pd){ac+=pd.adCost||0;sa+=pd.sales||0;cl+=pd.clicks||0;im+=pd.impressions||0;cnt++;}});
  return{adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cnt,
    cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};
}
function totRng(wks){
  let ac=0,sa=0,cl=0,im=0,cnt=0;
  wks.forEach(wk=>{const t=totWk(wk);if(t){ac+=t.adCost;sa+=t.sales;cl+=t.clicks;im+=t.impressions;cnt=Math.max(cnt,t.cnt);}});
  return{adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cnt,
    cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};
}
function pTot(key,wks){
  let ac=0,sa=0,cl=0,im=0,any=false;
  wks.forEach(wk=>{const pd=D[wk]?.platforms[key];if(pd){ac+=pd.adCost||0;sa+=pd.sales||0;cl+=pd.clicks||0;im+=pd.impressions||0;any=true;}});
  if(!any)return null;
  return{adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,
    cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};
}

/* ── 포맷 ── */
const fw=n=>n!=null?n.toLocaleString('ko-KR'):'-';
function rb(r){
  if(!r&&r!==0)return'<span class="badge bna">-</span>';
  if(r>=800)return`<span class="badge bhi">${r.toLocaleString()}%</span>`;
  if(r>=500)return`<span class="badge bmd">${r.toLocaleString()}%</span>`;
  return`<span class="badge blo">${r.toLocaleString()}%</span>`;
}
function dlt(c,p,good){
  if(p==null||c==null)return'';const d=c-p;if(d===0)return'';
  const pct=Math.round(Math.abs(d)/Math.abs(p)*100);
  return`<span class="${(good?d>0:d<0)?'up':'dn'}" style="font-size:9px;margin-left:2px">${d>0?'▲':'▼'}${pct}%</span>`;
}

/* ── 달력 ── */
function calMo(y,m){
  const DOWS=['일','월','화','수','목','금','토'];
  const MONS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const ts=d2s(new Date());const L=lo(),H=hi();
  const hH=hov&&rS&&!rE?(hov>=rS?hov:rS):H;
  const hL=hov&&rS&&!rE?(hov>=rS?rS:hov):L;
  const fd=new Date(Date.UTC(y,m,1)).getUTCDay();
  let dc=new Date(Date.UTC(y,m,1-fd));let cells='';
  for(let r=0;r<6;r++){
    let has=false;let row='';
    for(let c=0;c<7;c++){
      const d=new Date(dc);const ds=d2s(d);
      const other=d.getUTCMonth()!==m||d.getUTCFullYear()!==y;
      if(!other)has=true;
      let cls='dc';
      if(other)cls+=' other';
      if(c===0)cls+=' sun';if(c===6)cls+=' sat';
      if(ds===ts)cls+=' today';
      if(hL&&ds===hL)cls+=hH&&ds===hH?' rs re':' rs';
      else if(hH&&ds===hH&&!(hL&&ds===hL))cls+=' re';
      else if(hL&&hH&&ds>hL&&ds<hH)cls+=' ir';
      row+=`<div class="${cls}" onmousedown="dDown('${ds}')" onmouseenter="dEnter('${ds}')">${d.getUTCDate()}</div>`;
      dc.setUTCDate(dc.getUTCDate()+1);
    }
    if(r>=4&&!has)break;cells+=row;
  }
  return`<div><div class="dp-mt">${MONS[m]} ${y}</div><div class="cal-g">${DOWS.map(d=>`<div class="dow">${d}</div>`).join('')}${cells}</div></div>`;
}

function renderDP(){
  const MONS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const rM=(CL.m+1)%12,rY=CL.m===11?CL.y+1:CL.y;
  document.getElementById('dpTitle').textContent=`${CL.y}년 ${MONS[CL.m]} — ${rY}년 ${MONS[rM]}`;
  document.getElementById('dpMonths').innerHTML=calMo(CL.y,CL.m)+calMo(rY,rM);
  const L=lo(),H=hi();
  document.getElementById('dpVal').textContent=L&&H?fmtD(L,H):'날짜를 선택하세요';
  document.getElementById('dpX').style.display=L&&H?'':'none';
  let selTxt='시작일을 클릭하세요';
  if(rS&&rE)selTxt=`<strong>${fmtD(L,H)}</strong>`;
  else if(rS)selTxt=`<strong>${fmtD(rS,rS)}</strong> — 종료일 선택 중`;
  document.getElementById('dpSel').innerHTML=selTxt;
  document.getElementById('wkCnt').textContent=L&&H?rngWks(L,H).length+'개 주차 선택됨':'';
}

function toggleDP(e){
  e.stopPropagation();dpOpen=!dpOpen;
  document.getElementById('dpDrop').classList.toggle('open',dpOpen);
  renderDP();
}
function calNav(dir){
  CL.m+=dir;if(CL.m>11){CL.m=0;CL.y++;}if(CL.m<0){CL.m=11;CL.y--;}renderDP();
}
function dDown(ds){
  if(!rS||rE){rS=ds;rE=null;sel=true;}
  else{if(ds<rS){rE=rS;rS=ds;}else rE=ds;sel=false;}
  renderDP();
}
function dEnter(ds){if(sel&&rS&&!rE){hov=ds;renderDP();}}
function clearDP(){rS=null;rE=null;hov=null;sel=false;renderDP();renderAll();}
function applyDP(){
  if(!rS||!rE)return;
  const L=lo(),H=hi();rS=L;rE=H;
  const wks=rngWks(L,H);if(wks.length)curWk=wks[wks.length-1];
  dpOpen=false;document.getElementById('dpDrop').classList.remove('open');
  renderDP();renderAll();
}

/* ── AI 인사이트 ── */
function openAiPanel(e){
  const panel=document.getElementById('aiPanel');
  const rect=e.currentTarget.getBoundingClientRect();
  panel.style.top=(rect.bottom+6)+'px';
  panel.style.right=Math.max(8,window.innerWidth-rect.right)+'px';
  panel.style.left='auto';
  panel.style.display='block';
  document.getElementById('aiBody').innerHTML='<div style="display:flex;align-items:center;gap:6px;color:var(--text2)"><span>●</span><span>Claude가 분석 중...</span></div>';
  fetchAiInsight();
}
async function fetchAiInsight(){
  const wks=Object.keys(D).filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort();
  const recent=wks.slice(-3);
  const PNAME={alwayz:'올웨이즈 CPS',ssg:'SSG AI',gs:'GS홈쇼핑 AI',kurly:'컬리 AI',lotte_ai:'롯데ON AI',lotte_cpc:'롯데ON CPC',toss_ai:'토스 AI',toss_cpc:'토스 CPC',ohouse:'오늘의집 CPC',ali:'알리 CPC'};
  const summary=recent.map(wk=>{
    const p=D[wk]?.platforms||{};
    const rows=Object.entries(p).filter(([,v])=>v&&v.adCost>0).map(([k,v])=>
      '  '+( PNAME[k]||k)+': 광고비'+Math.round(v.adCost/1000)+'천원 매출'+Math.round(v.sales/1000)+'천원 ROAS'+v.roas+'%'+(v.ctr?' CTR'+v.ctr+'%':'')
    ).join('\n');
    return '【'+wkLbl(wk)+'】\n'+(rows||'  데이터없음');
  }).join('\n\n');

  const prompt='당신은 이커머스 광고 전문 컨설턴트입니다. 아래는 오아 주식회사의 최근 광고 플랫폼별 주차 성과 데이터입니다.\n\n'+summary+'\n\n위 데이터를 분석하여 다음 형식으로 답변해주세요.\n주의: 날짜는 반드시 05.11~05.17 형식으로, 전문용어 없이 쉽게, 금액은 185,000원 형식으로.\n\n**✅ 성과 우수 플랫폼 (2개)**\n- [플랫폼명]: ROAS [수치]% — [쉬운 설명 1줄]\n- [플랫폼명]: ROAS [수치]% — [쉬운 설명 1줄]\n\n**⚠️ 개선 필요 플랫폼 (2개)**\n- [플랫폼명]: ROAS [수치]% — [문제점과 해결방법 1줄]\n- [플랫폼명]: ROAS [수치]% — [문제점과 해결방법 1줄]\n\n**🎯 다음 주 할 일 (1가지)**\n[구체적 액션 2줄 이내]';

  const apiKey=window.__CLAUDE_KEY__||'';

  // API 키 없으면 바로 로컬 분석
  if(!apiKey){
    const msg='💡 Claude API 크레딧 부족 — API 사용 없이 데이터 기반으로 인사이트를 보여드립니다.';
    document.getElementById('aiBody').innerHTML=`<div style="color:var(--text2);font-size:11px">${msg}</div>`;
    const wks=Object.keys(D).filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort().slice(-3);
    renderInsightBar(wks);
    setTimeout(()=>{
      document.getElementById('aiBody').innerHTML=`<div style="color:var(--text2);font-size:11px">${msg}<br><span style="color:#166534">✓ 아래 인사이트 바에 표시됩니다.</span></div>`;
      document.getElementById('insightBar')?.scrollIntoView({behavior:'smooth',block:'center'});
    },300);
    return;
  }
  try{
    const res=await fetch('/api/claude',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-5',max_tokens:800,messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){
      let errMsg='';
      try{const e=await res.json();errMsg=e.error?.message||String(res.status);}
      catch(e){errMsg=String(res.status);}
      throw new Error(errMsg);
    }
    const data=await res.json();
    // 크레딧 소진 시 HTTP 200으로 에러 반환하는 경우 처리
    if(data.error){
      const errMsg=data.error?.message||JSON.stringify(data.error);
      throw new Error(errMsg);
    }
    const text=data.content?.[0]?.text||'';
    const fixAmt=t=>t.replace(/(\d+)천원/g,(_,n)=>parseInt(n)*1000+'원 ');
    const fixed=fixAmt(text);
    // 인사이트 바 업데이트
    // 수정: 이모지 멀티바이트 문제 → \*\* 기준으로 split (더 안정적)
    const sections=fixed.split(/\n(?=\*\*)/);
    let topHtml='',botHtml='',actHtml='';
    sections.forEach(sec=>{
      const lines=sec.trim().split('\n').filter(l=>l.trim());
      if(!lines.length)return;
      const title=lines[0].replace(/\*\*/g,'').trim();
      // 우수/개선/할일 판별: 이모지 포함 여부도 함께 체크
      const isTop=title.includes('우수')||title.includes('\u2705');
      const isBot=title.includes('개선')||title.includes('\u26a0');
      const isAct=title.includes('할 일')||title.includes('액션')||title.includes('\uD83C\uDFAF');
      const items=lines.slice(1).filter(l=>/^[•\-\*]/.test(l.trim()));
      const body=items.length
        ? items.map(l=>{const t=l.replace(/^[•\-\*]\s*/,'');const[pl,...rest]=t.split(':');return`<div style="margin-bottom:5px"><strong>${pl.trim()}</strong>${rest.length?': '+rest.join(':').trim():''}</div>`;}).join('')
        : lines.slice(1).map(l=>`<div style="margin-bottom:4px">${l.trim()}</div>`).join('');
      if(isTop)topHtml=`<div style="background:#F0FDF4;border:.5px solid #86EFAC;border-radius:6px;padding:10px 12px"><div style="font-size:10px;font-weight:600;color:#166534;margin-bottom:5px">${title}</div><div style="color:#166534">${body}</div></div>`;
      else if(isBot)botHtml=`<div style="background:#FFF1F2;border:.5px solid #FCA5A5;border-radius:6px;padding:10px 12px"><div style="font-size:10px;font-weight:600;color:#991B1B;margin-bottom:5px">${title}</div><div style="color:#991B1B">${body}</div></div>`;
      else if(isAct){const desc=lines.slice(1).filter(l=>l.trim()&&!/^[•\-\*]/.test(l.trim())).join(' ').trim()||items.map(l=>l.replace(/^[•\-\*]\s*/,'')).join(' ');actHtml=`<div style="background:#EFF6FF;border:.5px solid #93C5FD;border-radius:6px;padding:10px 12px"><div style="font-size:10px;font-weight:600;color:#1E40AF;margin-bottom:5px">${title}</div><div style="color:#1D4ED8">${fixAmt(desc)||body}</div></div>`;}
    });
    // 파싱 결과 없으면 전체 텍스트를 fallback으로 표시
    if(!topHtml&&!botHtml&&!actHtml){
      topHtml=`<div style="background:#F0FDF4;border:.5px solid #86EFAC;border-radius:6px;padding:10px 12px;grid-column:1/-1"><div style="color:#166534;font-size:11px;white-space:pre-line">${fixed}</div></div>`;
    }
    const bar=document.getElementById('insightBar');
    const content=document.getElementById('insightContent');
    const period=document.getElementById('insightPeriod');
    if(bar&&content){
      if(period)period.textContent='('+recent.map(w=>wkLbl(w)).join(', ')+')';
      bar.style.display='block';
      content.innerHTML=`<div>${topHtml}</div><div>${botHtml}</div><div>${actHtml}</div>`;
      bar.scrollIntoView({behavior:'smooth',block:'center'});
    }
    document.getElementById('aiBody').innerHTML='<div style="color:#166534;font-size:11px;display:flex;align-items:center;gap:5px"><span>✅</span> Claude API로 분석 완료 — 아래 인사이트 바에 표시됩니다.</div>';
  }catch(err){
    const isCreditErr=err.message&&(err.message.toLowerCase().includes('credit')||err.message.toLowerCase().includes('billing')||err.message.includes('402')||err.message.includes('400')||err.message.toLowerCase().includes('overload')||err.message.toLowerCase().includes('quota')||err.message.toLowerCase().includes('insufficient'));
    const msg=isCreditErr
      ? '💡 Claude API 크레딧 부족 — API 사용 없이 데이터 기반으로 인사이트를 보여드립니다.'
      : '💡 API 연결 실패 — 데이터 기반으로 인사이트를 보여드립니다.';
    document.getElementById('aiBody').innerHTML=`<div style="color:var(--text2);font-size:11px">${msg}</div>`;
    const wks=Object.keys(D).filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort().slice(-3);
    renderInsightBar(wks);
    setTimeout(()=>{

}
function renderInsightBar(sWks){
  const bar=document.getElementById('insightBar');const content=document.getElementById('insightContent');const period=document.getElementById('insightPeriod');
  if(!bar||!content)return;
  const allWks=Object.keys(D).filter(k=>/^\d{4}-W\d{2}$/.test(k)).sort();
  const recent=(sWks&&sWks.length>0)?[...new Set([...sWks])].sort().slice(-3):allWks.slice(-3);
  if(!recent.length){bar.style.display='none';return;}

  // 전주차 구하기 (recent 중 가장 이른 주의 바로 이전)
  const firstWk=recent[0];
  const firstIdx=allWks.indexOf(firstWk);
  const prevWk=firstIdx>0?allWks[firstIdx-1]:null;

  const PNAME={alwayz:'올웨이즈',ssg:'SSG',gs:'GS홈쇼핑',kurly:'컬리',lotte_ai:'롯데ON AI',lotte_cpc:'롯데ON CPC',toss_ai:'토스 AI',toss_cpc:'토스 CPC',ohouse:'오늘의집',ali:'알리'};

  // 현재 기간 집계
  const stats={};
  recent.forEach(wk=>{Object.entries(D[wk]?.platforms||{}).forEach(([k,v])=>{
    if(!v||!v.adCost)return;
    if(!stats[k])stats[k]={roas:[],adCost:0,sales:0,ctr:[],clicks:0};
    if(v.roas!=null&&!isNaN(v.roas))stats[k].roas.push(v.roas);
    stats[k].adCost+=v.adCost;stats[k].sales+=v.sales;stats[k].clicks+=v.clicks||0;
    if(v.ctr)stats[k].ctr.push(v.ctr);
  });});

  // 전주 집계
  const prevStats={};
  if(prevWk){Object.entries(D[prevWk]?.platforms||{}).forEach(([k,v])=>{
    if(!v||!v.adCost)return;
    prevStats[k]={adCost:v.adCost,sales:v.sales,roas:v.roas||0};
  });}

  const avg=arr=>arr.length?Math.round(arr.reduce((a,b)=>a+b)/arr.length):0;
  const fmt=n=>n>=10000?Math.round(n/10000)+'만':Math.round(n/1000)+'천';
  const diff=(a,b)=>b>0?Math.round((a-b)/b*100):0;

  const ranked=Object.entries(stats).filter(([,s])=>s.roas.length>0&&s.adCost>50000).map(([k,s])=>{
    const curRoas=avg(s.roas);
    const prev=prevStats[k];
    const roasDiff=prev?curRoas-prev.roas:null;
    const adCostDiff=prev?diff(s.adCost,prev.adCost):null;
    const salesDiff=prev?diff(s.sales,prev.sales):null;
    const avgCtr=s.ctr.length?parseFloat((s.ctr.reduce((a,b)=>a+b)/s.ctr.length).toFixed(2)):null;
    return{k,name:PNAME[k]||k,curRoas,roasDiff,adCost:s.adCost,sales:s.sales,adCostDiff,salesDiff,avgCtr};
  }).sort((a,b)=>b.curRoas-a.curRoas);

  if(!ranked.length){bar.style.display='none';return;}

  const trendTag=(v,unit='%')=>v==null?'':`<span style="font-size:9px;color:${v>0?'#16a34a':'#dc2626'}">${v>0?'▲':'▼'}${Math.abs(v)}${unit}</span>`;

  const actions={
    toss_cpc:'예산 10~20% 축소 후 효율 재측정',toss_ai:'소재 교체 및 타겟 재검토',
    ali:'고ROAS 상품 집중, 저효율 상품 중단',kurly:'예산 축소 테스트',
    lotte_cpc:'입찰가·키워드 정리',lotte_ai:'소재 리프레시',
    gs:'광고 기간·상품 점검',ssg:'현행 유지 or 소폭 증액',
    ohouse:'효율 우수 — 예산 증액 검토',alwayz:'안정적 운영 유지'
  };

  const top=ranked.slice(0,3);
  const bot=ranked.filter(p=>p.curRoas<700).slice(-2).reverse();
  const best=ranked[0];
  const worst=ranked.filter(p=>p.curRoas<600)[0];

  const topHtml=top.map(p=>`
    <div style="background:#F0FDF4;border:.5px solid #86EFAC;border-radius:6px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:10px;color:#166534;font-weight:600">✅ ${p.name}</div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span style="font-size:12px;font-weight:700;color:#15803D">ROAS ${p.curRoas}%</span>
        ${trendTag(p.roasDiff,'%p')}
      </div>
      <div style="font-size:10px;color:#166534">
        광고비 ${fmt(p.adCost)} ${trendTag(p.adCostDiff)} · 매출 ${fmt(p.sales)} ${trendTag(p.salesDiff)}
        ${p.avgCtr?' · CTR '+p.avgCtr+'%':''}
      </div>
    </div>`).join('');

  const botHtml=bot.map(p=>`
    <div style="background:#FFF1F2;border:.5px solid #FCA5A5;border-radius:6px;padding:8px 10px;margin-bottom:6px">
      <div style="font-size:10px;color:#991B1B;font-weight:600">⚠️ ${p.name}</div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span style="font-size:12px;font-weight:700;color:#B91C1C">ROAS ${p.curRoas}%</span>
        ${trendTag(p.roasDiff,'%p')}
      </div>
      <div style="font-size:10px;color:#991B1B">
        광고비 ${fmt(p.adCost)} ${trendTag(p.adCostDiff)} · 매출 ${fmt(p.sales)} ${trendTag(p.salesDiff)}
      </div>
      <div style="font-size:10px;color:#991B1B;margin-top:3px">→ ${actions[p.k]||'점검 권장'}</div>
    </div>`).join('');

  const actHtml=`
    <div style="background:#EFF6FF;border:.5px solid #93C5FD;border-radius:6px;padding:8px 10px">
      <div style="font-size:10px;color:#1E40AF;font-weight:600">🎯 다음 주 액션</div>
      <div style="font-size:11px;color:#1D4ED8;font-weight:500;margin-top:3px">${best.name} 예산 증액 검토</div>
      <div style="font-size:10px;color:#1E40AF;margin-top:2px">${worst?worst.name+' 예산 축소로 전체 ROAS 개선 가능':'현행 예산 배분 유지'}</div>
      ${ranked.some(p=>p.roasDiff!=null&&p.roasDiff<-50)?`<div style="font-size:10px;color:#dc2626;margin-top:2px">⚠️ ${ranked.filter(p=>p.roasDiff!=null&&p.roasDiff<-50).map(p=>p.name).join(', ')} ROAS 급락 — 즉시 점검 필요</div>`:''}
    </div>`;

  period.textContent='('+recent.map(w=>wkLbl(w)).join(', ')+')';
  bar.style.display='block';
  content.innerHTML=`
    <div><div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px">TOP 플랫폼</div>${topHtml}</div>
    <div><div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px">개선 필요</div>${botHtml||'<div style="font-size:11px;color:var(--text3)">모든 플랫폼 양호</div>'}</div>
    <div><div style="font-size:10px;font-weight:600;color:var(--text2);margin-bottom:6px">추천 액션</div>${actHtml}</div>`;
}

  return `광고 플랫폼 6개에서 기간 ${L} ~ ${H} 데이터를 수집하고 대시보드에 직접 저장해줘.

금액: 원 단위 숫자만(콤마없이) / ctr: % 숫자만(예:1.23) / 없는 항목은 0

【2. SSG AI】 https://ad.ssg.com → "ssg"

/* ── 토스 성과 보고서 파서 ── */
function parseTossReport(rows, hdr){
  const idx={
    date:   hdr.findIndex(h=>h==='일자'),
    adSet:  hdr.findIndex(h=>h==='광고 세트'),
    imp:    hdr.findIndex(h=>h==='노출수'),
    clk:    hdr.findIndex(h=>h==='클릭수'),
    sales:  hdr.findIndex(h=>h==='총 전환 거래액'),
    cost:   hdr.findIndex(h=>h==='집행 광고비'),
    cpc:    hdr.findIndex(h=>h==='클릭당 비용'),
  };

  // 날짜별 → 주차별 집계
  const byWeek={};
  for(let r=1;r<rows.length;r++){
    const row=rows[r];
    const raw=row[idx.date];
    if(raw===null||raw===undefined||raw==='') continue;
    let dt;
    try{
      if(raw instanceof Date && !isNaN(raw)){
        dt=new Date(Date.UTC(raw.getFullYear(),raw.getMonth(),raw.getDate()));
      } else if(typeof raw==='number' && raw>0){
        // Excel serial: 1900-01-01=1 기준
        dt=new Date(Date.UTC(1899,11,30) + Math.floor(raw)*86400000);
      } else if(typeof raw==='string' && raw.trim()){
        const p=new Date(raw.trim());
        if(isNaN(p)) continue;
        dt=new Date(Date.UTC(p.getFullYear(),p.getMonth(),p.getDate()));
      } else continue;
      if(isNaN(dt)) continue;
    }catch(e){continue;}
    const wk=isoWk(dt);
    if(!byWeek[wk]) byWeek[wk]={ai:{adCost:0,sales:0,impressions:0,clicks:0},cpc:{adCost:0,sales:0,impressions:0,clicks:0}};

    const adSet=String(row[idx.adSet]||'');
    const bucket=adSet.includes('스마트 자동운영')?'ai':'cpc';
    byWeek[wk][bucket].adCost     += parseFloat(row[idx.cost]||0);
    byWeek[wk][bucket].sales      += parseFloat(row[idx.sales]||0);
    byWeek[wk][bucket].impressions+= parseFloat(row[idx.imp]||0);
    byWeek[wk][bucket].clicks     += parseFloat(row[idx.clk]||0);
  }

  let saved=0;
  Object.entries(byWeek).forEach(([wk,{ai,cpc}])=>{
    if(!D[wk]) D[wk]={label:wkLbl(wk),platforms:{}};
    const p=D[wk].platforms;

    const mkPlt=o=>{
      const ac=Math.round(o.adCost), sa=Math.round(o.sales),
            cl=Math.round(o.clicks), im=Math.round(o.impressions);
      return{adCost:ac,sales:sa,
        roas:ac>0?Math.round(sa/ac*100):0,
        clicks:cl,impressions:im,
        cpc:cl>0?Math.round(ac/cl):null,
        ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};
    };

    if(ai.adCost||ai.clicks)   p.toss_ai  = mkPlt(ai);
    if(cpc.adCost||cpc.clicks) p.toss_cpc = mkPlt(cpc);
    saved++;
  });

  save();
  const wks=Object.keys(byWeek).sort();
  if(wks.length===0){toast('토스 파일에서 날짜 데이터를 읽을 수 없습니다','err');return;}
  curWk=wks[wks.length-1];
  const L2=lo(), H2=hi();
  if(wks[0]){const{start}=wkDates(wks[0]);CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};}
  toast(`토스 ${wks.join(', ')} 저장 완료 (AI/CPC 분리)`, 'ok');
  renderDP();renderAll();
}

/* ── 파서들 ── */
function parseOhouseDual(campCSV,dailyCSV){
  function parseCSV(text){text=text.replace(/^﻿/,'');const lines=text.trim().split('\n');function pr(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.replace(/,/g,'').trim());c='';}else c+=ch;}r.push(c.replace(/,/g,'').trim());return r;}const hdr=pr(lines[0]);return lines.slice(1).filter(l=>l.trim()).map(l=>{const v=pr(l);const o={};hdr.forEach((h,i)=>o[h]=v[i]||'');return o;});}
  const pn=s=>parseFloat(String(s).replace(/[,%]/g,''))||0;
  let oaCost=0,total=0;
  parseCSV(campCSV).forEach(r=>{const c=pn(r['집행 광고비']);total+=c;if(r['캠페인명']&&r['캠페인명'].startsWith('오아'))oaCost+=c;});
  const ratio=total>0?oaCost/total:1;
  const bw={};
  parseCSV(dailyCSV).forEach(r=>{const dt=new Date((r['날짜']||'')+'T00:00:00Z');if(isNaN(dt))return;const wk=isoWk(dt);if(!bw[wk])bw[wk]={adCost:0,sales:0,impressions:0,clicks:0};bw[wk].adCost+=pn(r['집행 광고비'])*ratio;bw[wk].sales+=pn(r['광고 전환 매출'])*ratio;bw[wk].impressions+=pn(r['노출수'])*ratio;bw[wk].clicks+=pn(r['클릭수'])*ratio;});
  let saved=0;Object.entries(bw).forEach(([wk,o])=>{if(!D[wk])D[wk]={label:wkLbl(wk),platforms:{}};const p=D[wk].platforms;const ac=Math.round(o.adCost),sa=Math.round(o.sales),cl=Math.round(o.clicks),im=Math.round(o.impressions);p.ohouse={adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};saved++;});
  const wks=Object.keys(bw).sort();if(!wks.length){toast('오늘의집 날짜 없음','err');return;}
  curWk=wks[wks.length-1];const{start}=wkDates(wks[0]);CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};
  toast('오늘의집(오아) '+wks.join(', ')+' 저장 ('+saved+'주차) — 오아비율 '+Math.round(ratio*100)+'%','ok');save();renderDP();renderAll();
}

  function pr(line){const r=[];let c='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c.replace(/,/g,'').trim());c='';}else c+=ch;}r.push(c.replace(/,/g,'').trim());return r;}
  const hdr=pr(lines[0]).map(h=>h.trim());const idx={date:hdr.indexOf('날짜'),cost:hdr.indexOf('집행 광고비'),sales:hdr.indexOf('광고 전환 매출'),imp:hdr.indexOf('노출수'),clk:hdr.indexOf('클릭수')};

  let saved=0;Object.entries(bw).forEach(([wk,o])=>{if(!D[wk])D[wk]={label:wkLbl(wk),platforms:{}};const p=D[wk].platforms;if(p.ohouse)return;const ac=Math.round(o.adCost),sa=Math.round(o.sales),cl=Math.round(o.clicks),im=Math.round(o.impressions);p.ohouse={adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};saved++;});
  const wks=Object.keys(bw).sort();if(!wks.length){toast('오늘의집 날짜 없음','err');return;}
  curWk=wks[wks.length-1];const{start}=wkDates(wks[0]);CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};
  toast('오늘의집 '+wks.join(', ')+' 저장 ('+saved+'주차)','ok');save();renderDP();renderAll();
}
function parseAliReport(rows){

  let saved=0;Object.entries(bw).forEach(([wk,o])=>{if(!D[wk])D[wk]={label:wkLbl(wk),platforms:{}};const p=D[wk].platforms;const ac=Math.round(o.adCost),sa=Math.round(o.sales),cl=Math.round(o.clicks),im=Math.round(o.impressions);p.ali={adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};saved++;});
  const wks=Object.keys(bw).sort();if(!wks.length){toast('알리 날짜 없음','err');return;}
  curWk=wks[wks.length-1];const{start}=wkDates(wks[0]);CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};
  toast('알리 '+wks.join(', ')+' 저장 ('+saved+'주차)','ok');save();renderDP();renderAll();
}
function parseGsReport(file){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parser=new DOMParser();const doc=parser.parseFromString(e.target.result,'text/html');const rows=[...doc.querySelectorAll('tr')];
      let hdrIdx=-1,hdr=[];for(let i=0;i<rows.length;i++){const cells=[...rows[i].querySelectorAll('td,th')].map(c=>c.textContent.trim());if(cells.includes('일자')&&cells.includes('총 광고비(원)')){hdrIdx=i;hdr=cells;break;}}
      if(hdrIdx<0){toast('GS 헤더 못 찾음','err');return;}
      const ci={date:hdr.findIndex(h=>h==='일자'),imp:hdr.findIndex(h=>h==='노출수'),clk:hdr.findIndex(h=>h==='클릭수'),cost:hdr.findIndex(h=>h==='총 광고비(원)'),sales:hdr.findIndex(h=>h==='전환매출')};
      const bw={};for(let i=hdrIdx+1;i<rows.length;i++){const cells=[...rows[i].querySelectorAll('td,th')].map(c=>c.textContent.trim());if(cells.length<5)continue;const ds=cells[ci.date];if(!ds||!/^\d{8}$/.test(ds))continue;const dt=new Date(ds.slice(0,4)+'-'+ds.slice(4,6)+'-'+ds.slice(6,8)+'T00:00:00Z');if(isNaN(dt))continue;const wk=isoWk(dt);if(!bw[wk])bw[wk]={adCost:0,sales:0,impressions:0,clicks:0};const pn=s=>parseFloat(String(s).replace(/[,% ]/g,''))||0;bw[wk].adCost+=pn(cells[ci.cost]);bw[wk].sales+=pn(cells[ci.sales]);bw[wk].impressions+=pn(cells[ci.imp]);bw[wk].clicks+=pn(cells[ci.clk]);}
      let saved=0;Object.entries(bw).forEach(([wk,o])=>{if(!D[wk])D[wk]={label:wkLbl(wk),platforms:{}};const p=D[wk].platforms;if(p.gs&&p.gs.impressions)return;const ac=Math.round(o.adCost),sa=Math.round(o.sales),cl=Math.round(o.clicks),im=Math.round(o.impressions);p.gs={adCost:ac,sales:sa,roas:ac>0?Math.round(sa/ac*100):0,clicks:cl,impressions:im,cpc:cl>0?Math.round(ac/cl):null,ctr:im>0?parseFloat((cl/im*100).toFixed(2)):null};saved++;});
      const wks=Object.keys(bw).sort();if(!wks.length){toast('GS 날짜 없음','err');return;}
      curWk=wks[wks.length-1];const{start}=wkDates(wks[0]);CL={y:start.getUTCFullYear(),m:start.getUTCMonth()};
      toast('GS홈쇼핑 '+wks.join(', ')+' 저장 ('+saved+'주차)','ok');save();renderDP();renderAll();
    }catch(err){toast('GS 파싱 오류: '+err.message,'err');}
  };reader.readAsText(file,'UTF-8');
}

/* ── 엑셀 업로드 ── */
function handleXlsx(input){
  const files=[...input.files];if(!files.length)return;
  const csvFiles=files.filter(f=>f.name.endsWith('.csv'));
  const xlsFiles=files.filter(f=>!f.name.endsWith('.csv'));
  // CSV 2개: 오늘의집 캠페인별+일별
  if(csvFiles.length>=2){
    const readT=f=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(f,'UTF-8');});
    Promise.all(csvFiles.map(readT)).then(texts=>{
      const camp=texts.find(t=>t.includes('캠페인명'));
      const daily=texts.find(t=>!t.includes('캠페인명')&&t.includes('날짜'));
      if(camp&&daily)parseOhouseDual(camp,daily);else texts.forEach(t=>parseOhouseCSV(t));
    });
  } else if(csvFiles.length===1){
    const r=new FileReader();r.onload=e=>{
      const text=e.target.result;
      if(text.includes('캠페인명')){window._ohCamp=text;toast('캠페인별 파일 확인 ✓ — 일별 파일도 선택해주세요','ok');}
      else if(window._ohCamp){parseOhouseDual(window._ohCamp,text);window._ohCamp=null;}
      else parseOhouseCSV(text);
    };r.readAsText(csvFiles[0],'UTF-8');
  }
  // XLS/XLSX
  const readB=f=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsArrayBuffer(f);});
  xlsFiles.forEach(async file=>{
    if(file.name.toLowerCase().includes('gsshop')||file.name.toLowerCase().includes('gs홈')){parseGsReport(file);return;}
    const buf=await readB(file);
    try{
      const wb=XLSX.read(buf,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const hdr0=rows[0]?rows[0].map(c=>String(c).trim()):[];
      if(hdr0.includes('Date')&&hdr0.includes('Expense')&&hdr0.includes('Store sales')){parseAliReport(rows);return;}
      if(hdr0.includes('광고 세트')&&hdr0.includes('집행 광고비')&&hdr0.includes('총 전환 거래액')){parseTossReport(rows,hdr0);return;}
      toast(file.name+' — 인식 불가','err');
    }catch(err){toast(file.name+' 오류: '+err.message,'err');}
  });
  input.value='';
}
